name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = require("./npm-audit.json"); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(`${name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`); console.log("Totals:", JSON.stringify(report.metadata?.vulnerabilities || {}));'

      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Check types
        run: npm run typecheck

      - name: Build application
        run: npm run build

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialise local Supabase configuration
        run: supabase init

      - name: Start local Supabase services and apply migrations
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Supabase startup attempt ${attempt}/3"
            if supabase start -x studio,imgproxy,edge-runtime,logflare,vector; then
              exit 0
            fi
            supabase stop --no-backup || true
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "Supabase could not start after three attempts."
          exit 1

      - name: Run database security tests
        run: supabase test db

      - name: Export local Supabase credentials
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "OPENAI_API_KEY=ci-test-only-not-a-real-key"
            echo "OPENAI_MODEL=gpt-4.1-mini"
          } >> "$GITHUB_ENV"

      - name: Install application dependencies
        run: npm ci

      - name: Build application for authenticated smoke test
        run: npm run build

      - name: Start application server
        shell: bash
        run: |
          npm run start > /tmp/personal-ai-agent-next.log 2>&1 &
          echo $! > /tmp/personal-ai-agent-next.pid
          for attempt in {1..30}; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)"
            if [ "$status" = "200" ]; then
              echo "Application server is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/personal-ai-agent-next.log
          exit 1

      - name: Run authenticated application smoke test
        run: npm run test:e2e:smoke

      - name: Stop application server
        if: always()
        run: |
          if [ -f /tmp/personal-ai-agent-next.pid ]; then
            kill "$(cat /tmp/personal-ai-agent-next.pid)" || true
          fi

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
