name: CI

on:
  push:
    branches: [main, agent/supabase-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = require("./npm-audit.json"); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(`${name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`); console.log("Totals:", JSON.stringify(report.metadata?.vulnerabilities || {}));'

      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Check types
        run: npm run typecheck

      - name: Build application
        run: npm run build
