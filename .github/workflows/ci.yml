name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Commit generated dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Dependency lockfile is already tracked."
            exit 0
          fi
          git fetch origin "${{ github.head_ref }}"
          git switch -c ci-lockfile --track "origin/${{ github.head_ref }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm dependency lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = require("./npm-audit.json"); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(`${name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`); console.log("Totals:", JSON.stringify(report.metadata?.vulnerabilities || {}));'

      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Check types
        run: npm run typecheck

      - name: Build application
        run: npm run build

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialise local Supabase configuration
        run: supabase init

      - name: Start local Supabase services and apply migrations
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Supabase startup attempt ${attempt}/3"
            if supabase start -x studio,imgproxy,edge-runtime,logflare,vector; then
              exit 0
            fi
            supabase stop --no-backup || true
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "Supabase could not start after three attempts."
          exit 1

      - name: Run database security tests
        run: supabase test db

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
